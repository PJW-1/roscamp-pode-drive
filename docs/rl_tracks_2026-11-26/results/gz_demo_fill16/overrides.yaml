# Gazebo fifteenth batch: cand12.yaml plus FollowPathRLShimDemoHistMask (scan_mask_deg only) and FollowPathRLShimDemoHistFill (same mask + scan_mask_fill), both store_arena_demohist (worklog section 35).
# Gazebo twelfth batch: cand11hd.yaml plus FollowPathRLShimDemoHistStop = store_arena_demohist with the closing stop on (worklog section 26).
# 후보 정책 Gazebo 비교(열한째 묶음): cand9b.yaml에서 DemoStd를 빼고 아래 블록을 더했다. policy 말고는 ACD3 블록과 같다.
# FollowPathRLShimDemoHist = store_arena_demohist, FollowPathRLShimStd = store_arena_std, FollowPathRLShimDemoHist2 = store_arena_demohist2 (the histstd block is dropped: that policy is not in the repository)
controller_server:
  ros__parameters:
    controller_plugins:
    - FollowPath
    - FollowPathThrough
    - FollowPathReverse
    - FollowPathGoal
    - FollowPathMPPI
    - FollowPathRL
    - FollowPathRLShimACD3
    - FollowPathRLShimDemoHist
    - FollowPathRLShimStd
    - FollowPathRLShimDemoHist2
    - FollowPathRLShimDemoHistStop
    - FollowPathRLShimDemoHistMask
    - FollowPathRLShimDemoHistFill
    FollowPathRL:
      plugin: pode_rl_controller::FollowPathRL
      policy: store_arena_acd3
      scan_topic: scan
      scan_timeout: 0.5
      transform_tolerance: 0.2
      intra_op_threads: 1
      rotate_gain: 1.5
      log_period: 1.0
      rear_stop_range: 0.0
      rear_half_width_deg: 30.0
    FollowPathRLShimACD3:
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: pode_rl_controller::FollowPathRL
      angular_dist_threshold: 0.785
      angular_disengage_threshold: 0.39
      forward_sampling_distance: 0.15
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 2.0
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      policy: store_arena_acd3
      scan_topic: scan
      scan_timeout: 0.5
