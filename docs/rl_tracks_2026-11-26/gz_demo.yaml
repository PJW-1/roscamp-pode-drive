# 시연 조건에 맞춘 Gazebo 묶음의 설정. tools/nav_bench/scenarios.yaml을 베끼고 장애물 둘과 시나리오 둘을 더했다.
# 시연 조건(사용자 설명): 정적 장애물은 통로에 하나, 넓은 공간에 하나. 사람은 남쪽 진열대 틈으로 통로를 오간다.
# 통로 안에서 피해 지나가는지를 본다(계획 경로와 실제 궤적이 모두 가운데 통로 안이면 통로 판).
# 좌표는 map 틀(v7 경기장, 1.98 x 0.98 m)이다. 라이다 높이는 약 0.125 m라 모든 장애물을 0.20 m 이상으로 둔다.

world: arena
robot: pode1
controllers: [FollowPathGoal, FollowPathMPPI]  # 앞이 RPP(기본), 뒤가 MPPI
repeats: 10  # 시나리오마다 컨트롤러마다 이만큼. 순서는 ABBA(짝수면 두 컨트롤러가 먼저 도는 횟수가 같다)
leg_timeout_s: 90.0  # sim 초. 넘으면 실패로 적고 goal을 취소한다
flake_s: 3.0  # 이 sim 초 안에 움직이지도 않고 ABORTED면(planner 응답 20 ms 시간 초과 같은 Nav2 쪽 일) 한 번 다시 보낸다.
             # 다시 보낸 판은 기록에 retried로 남는다
settle_s: 2.0  # 선택을 바꾼 뒤와 장애물을 놓은 뒤 기다리는 sim 초
start: {x: 0.49, y: 0.625, yaw_deg: 110}  # O_IN. 잰 구간이 끝나면 RPP로 여기로 돌아온다(재지 않음)
goal: {x: 1.645, y: 0.55, yaw_deg: 0}  # M_E. 가운데 통로(HALL)를 지난다
park: {x: 5.0, y: 5.0}  # 쓰지 않는 장애물을 경기장 밖에 둔다(x는 장애물마다 0.5씩 더함)

# 판정
blocked_window_s: 10.0  # 이 시간 동안 실제 위치가 blocked_move_m보다 덜 움직이면 BLOCKED 한 번
blocked_move_m: 0.05  # pode_fsm blocked_after_s와 같은 10 s, progress checker와 같은 0.05 m
arrive_m: 0.10  # 성공은 Nav2 SUCCEEDED이면서 실제 위치가 goal에서 이 거리 안일 때(AMCL이 틀려도 속지 않게)
collision_m: 0.005  # 몸(local_costmap 다각형 발자국)과 장애물 면의 실제 거리가 이 값 이하면 충돌
doridori_deadband: 0.02  # rad/s. |wz|가 이보다 작은 명령은 부호 바꿈을 셀 때 건너뛴다
corridor_band: [0.404, 0.754]  # 가운데 통로의 y 범위(남쪽 진열대 위 ~ 진열대 A 아래). 계획 경로와 실제 궤적이 모두 이 안이면 "통로 판"
turn_wz: 0.3  # rad/s. vx가 0이고 |wz|가 이 이상인 명령 시간은 "제자리 회전"으로 센다(shim은 1.0 rad/s로 돈다)
start_tol_m: 0.03  # 판을 시작할 때 실제 위치가 출발점에서 이보다 멀면
start_tol_deg: 5.0  # 또는 방향이 이보다 틀어지면 Gazebo에서 출발점으로 옮기고 replaced로 남긴다(goal checker 0.05 m, 6.9°보다 좁게)

movers:
# 가운데 통로의 장애물은 진열대 A 남쪽 면(0.754)을 기준으로 둔다(면과의 거리를 그대로 지킨다)
  box:  # (b) 가만히 있는 상자. 통로 북쪽 절반에 두어 남쪽으로 0.19 m가 남는다
    shape: box
    size: [0.10, 0.10, 0.25]
    path: [[1.10, 0.644]]
    speed: 0.0
  person:  # (c) 사람 대역: 남쪽 진열대 틈을 가로질러 오간다
    shape: cylinder
    size: [0.04, 0.25]  # 반지름, 높이
    path: [[1.139, 0.28], [1.139, 0.684]]  # 북쪽 끝은 진열대 A 남쪽 면에서 3 cm 떨어진다
    speed: 0.10
  cart:  # (c) 카트 대역: 통로 북쪽 줄을 따라 천천히 오간다
    shape: box
    size: [0.14, 0.09, 0.20]
    path: [[0.80, 0.664], [1.45, 0.664]]
    speed: 0.06
  robot:  # (d) 마주 오는 로봇 대역: Pode 크기, 통로 북쪽 줄(y 0.684)로 서쪽으로 한 번 간다
    shape: box
    size: [0.12, 0.112, 0.20]
    path: [[1.62, 0.684], [0.50, 0.684]]
    speed: 0.12
    once: true  # 끝에 서 있는다(오가지 않는다)
    yield_m: 0.25  # 우리 로봇 중심과 이만큼 가까우면 멈춰 기다린다(충돌 검사로 서는 로봇처럼)

  e_box:  # (e) 통로 안 회피: 진열대 A에 붙인 작은 상자. 남쪽으로 0.30 m가 남게 두께를 0.04로 둔다
    shape: box
    size: [0.06, 0.04, 0.25]
    path: [[0.90, 0.729]]
    speed: 0.0
  e_cart:  # (e) 진열대 A 아래를 천천히 오가는 작은 카트. 남쪽 틈은 상자와 같다
    shape: box
    size: [0.10, 0.04, 0.20]
    path: [[1.15, 0.729], [1.45, 0.729]]
    speed: 0.05


  demo_cart:  # 통로 안에 세워 둔 카트. 진열대 A 남쪽 면에서 2 cm 떨어져 남쪽으로 0.24 m가 남는다
    shape: box
    size: [0.14, 0.09, 0.20]
    path: [[0.85, 0.689]]
    speed: 0.0
  demo_cart_hall:  # 서쪽 넓은 공간에 세워 둔 카트. 출발점에서 통로 입구로 가는 길의 남쪽에 있다
    shape: box
    size: [0.14, 0.09, 0.20]
    path: [[0.60, 0.44]]
    speed: 0.0
  stander:  # 통로 카트 옆에 서 있는 사람. 카트와의 사이 0.084 m, 남쪽 진열대와의 사이 0.076 m라 몸(0.094 m)이 못 지나간다
    shape: cylinder
    size: [0.04, 0.25]
    path: [[0.85, 0.52]]
    speed: 0.0
  person_n:  # 사람 대역, 북쪽 끝에서 출발하고 남쪽 끝이 0.31이다(왕복 7.5 s). 로봇이 틈에 닿을 때(판 시작 뒤 8.2 s쯤) 통로를 남쪽으로 건넌다
    shape: cylinder
    size: [0.04, 0.25]
    path: [[1.139, 0.684], [1.139, 0.31]]
    speed: 0.10
  person_t:  # 사람 대역, 로봇이 x 0.85를 넘을 때 틈의 남쪽 입구에서 북쪽으로 출발한다. 2.05 s 뒤 로봇의 줄(y 0.55)을 건넌다
    shape: cylinder
    size: [0.04, 0.25]
    path: [[1.139, 0.345], [1.139, 0.684]]
    speed: 0.10
    start_x: 0.85  # 로봇의 실제 x가 이 값을 넘어야 출발한다(만남이 로봇의 속도와 출발 시각에 묶이지 않게)
  person_once_s:  # 사람 대역, 로봇이 x 0.90을 넘을 때 통로 북쪽 끝에서 남쪽으로 한 번 건너 틈 안(통로 밖)에 선다
    shape: cylinder
    size: [0.04, 0.25]
    path: [[1.139, 0.684], [1.139, 0.31]]
    speed: 0.10
    once: true  # 끝에 서 있는다(오가지 않는다)
    start_x: 0.90  # 1.14 s 뒤 로봇의 줄(y 0.57)을 건넌다. 출발 전에는 통로 북쪽 끝에 서 있다(남쪽으로 0.24 m가 남는다)
  person_once_n:  # 사람 대역, 로봇이 x 0.85를 넘을 때 틈의 남쪽 입구에서 북쪽으로 한 번 건너 통로 북쪽 끝에 선다
    shape: cylinder
    size: [0.04, 0.25]
    path: [[1.139, 0.345], [1.139, 0.684]]
    speed: 0.10
    once: true  # 건넌 뒤에는 통로 북쪽 끝에 서 있는다(남쪽으로 0.24 m가 남는다)
    start_x: 0.85

scenarios:
  a_hall: []
  b_static: [box]
  c_moving: [person, cart]
  d_robot: [robot]
  e_corridor: [e_box, e_cart]
  f_cart: [demo_cart]  # 통로 안 정적 장애물 하나
  g_demo: [demo_cart, demo_cart_hall, person]  # 통로 하나 + 넓은 공간 하나 + 틈을 건너는 사람
  h_block: [demo_cart, stander]  # 통로가 막힘: 카트 옆에 사람이 서 있어 그 통로로는 못 지나간다
  i_cross: [person]  # 틈을 건너는 사람만: 카트 없이 건너는 사람과의 만남만 본다
  j_cross: [person_n]  # 틈을 건너는 사람과 실제로 만난다: 로봇이 틈에 닿을 때 사람이 통로를 내려오는 중이다
  k_cross: [person_t]  # 로봇이 틈 0.29 m 앞에 오면 사람이 틈에서 올라와 앞을 건넌다(로봇 위치로 출발)
  l_once: [person_once_s]  # 사람이 로봇 앞을 한 번 건너 통로 밖으로 나간다(오가지 않는다)
  m_once: [person_once_n]  # 사람이 로봇 앞을 한 번 건너 통로 북쪽 끝에 선다(그 남쪽으로 지나가야 한다)
